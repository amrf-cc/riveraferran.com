<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site content · adrian-portfolio</title>
<style>
  :root { --paper:#f7f3ea; --ink:#1c1a17; --muted:#6d675c; --tomato:#d4432c; --line:#ded6c6; --card:#fffdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "Inter",-apple-system,Helvetica,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:18px; align-items:baseline; }
  h1 { font-size:16px; margin:0; letter-spacing:.02em; }
  h1 span { color:var(--tomato); }
  .tabs { display:flex; gap:6px; margin-left:auto; }
  .tabs button { border:1px solid var(--line); background:transparent; padding:7px 14px; border-radius:999px; cursor:pointer; font:inherit; color:var(--muted); }
  .tabs button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  main { max-width:1080px; margin:0 auto; padding:22px 24px 80px; }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
  .bar input[type=search] { flex:1; }
  input, textarea, select { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%; }
  textarea { resize:vertical; min-height:64px; }
  label { display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:10px 0 4px; }
  .grid { display:grid; gap:0 14px; }
  .g2 { grid-template-columns:1fr 1fr; }
  .g3 { grid-template-columns:1fr 1fr 1fr; }
  details.card { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  details.card > summary { cursor:pointer; padding:12px 14px; display:flex; gap:12px; align-items:baseline; }
  details.card > summary::-webkit-details-marker { display:none; }
  .who { font-weight:600; }
  .what { color:var(--muted); font-size:13px; }
  .meta { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
  .body { padding:4px 14px 16px; border-top:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button.save { background:var(--tomato); color:#fff; border:0; padding:9px 16px; border-radius:6px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); padding:9px 14px; border-radius:6px; font:inherit; cursor:pointer; }
  .status { font-size:13px; color:var(--muted); }
  .status.bad { color:var(--tomato); }
  .status.good { color:#2f6b3a; }
  .chk { display:flex; gap:8px; align-items:center; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); }
  .chk input { width:auto; }
  .hint { color:var(--muted); font-size:12px; }
  .tab { display:none; }
  .tab.on { display:block; }
  .ph { color:var(--tomato); }
  #build { font-size:12px; color:var(--muted); margin-left:10px; }
  .copy-block { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .copy-block h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .media { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; }
  .media h3 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; display:flex; gap:10px; align-items:center; }
  .media h3 button { font-size:11px; padding:4px 9px; }
  .strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .tile { flex:0 0 132px; background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .tile img { display:block; width:100%; height:110px; object-fit:cover; background:#e8e2d5; }
  .tile .ctl { display:flex; gap:2px; padding:4px; align-items:center; justify-content:space-between; }
  .tile .ctl button { border:1px solid var(--line); background:var(--card); border-radius:4px; padding:1px 6px; cursor:pointer; font-size:12px; line-height:1.6; }
  .tile .ctl button.del { color:var(--tomato); }
  .tile .idx { font-size:11px; color:var(--muted); }
  .tile input { border:0; border-top:1px solid var(--line); border-radius:0; font-size:11px; padding:5px 6px; }
  .cover { position:relative; }
  .cover .badge { position:absolute; top:6px; left:6px; background:var(--ink); color:var(--paper); font-size:10px; padding:2px 6px; border-radius:3px; letter-spacing:.05em; }
  .vids { display:grid; gap:8px; }
  .vid { display:grid; grid-template-columns:96px 1fr 150px; gap:10px; align-items:start; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px; }
  .vid .poster { width:96px; height:60px; object-fit:cover; border-radius:4px; background:#e8e2d5; border:0; }
  .vid .none { width:96px; height:60px; border:1px dashed var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); cursor:pointer; text-align:center; }
  .vid label { margin:0 0 2px; font-size:10px; }
  .vid .ctl { display:flex; gap:4px; margin-top:6px; }
  .vid .ctl button { border:1px solid var(--line); background:var(--card); border-radius:4px; padding:2px 7px; cursor:pointer; font-size:12px; }
  .uploading { font-size:12px; color:var(--tomato); }
</style>
</head>
<body>
<header>
  <h1>Site content <span>·</span> adrian-portfolio</h1>
  <span id="build"></span>
  <div class="tabs">
    <button data-tab="projects" class="on">Projects</button>
    <button data-tab="copy">Site copy</button>
  </div>
</header>
<main>
  <section id="projects" class="tab on">
    <div class="bar">
      <input type="search" id="q" placeholder="Filter projects by client, title or slug">
      <button class="ghost" id="newbtn">New project</button>
      <button class="ghost" id="rebuild">Rebuild site</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="copy" class="tab">
    <div id="copyform"></div>
    <div class="row"><button class="save" id="savecopy">Save site copy</button><span class="status" id="copystatus"></span></div>
  </section>
</main>

<script>
const S = { data:null, categories:[], stamp:0, open:null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const lines = v => (v || []).join("\n");
const isPh = v => /^\s*\[Placeholder/i.test(v || "");

function status(el, text, kind) { el.textContent = text; el.className = "status " + (kind || ""); }

async function load() {
  const r = await fetch("/api/content");
  const d = await r.json();
  if (!r.ok) { alert(d.error || "Could not load"); return; }
  S.data = d; S.categories = d.categories || []; S.stamp = Date.now();
  $("#build").textContent = d.build.ok ? "last build ok" : "last build failed";
  render(); renderCopy();
}

function option(sel, val, label) {
  return `<option value="${esc(val)}"${sel === val ? " selected" : ""}>${esc(label)}</option>`;
}
function catSelect(p) {
  const opts = S.categories.map(c => option(p.category, c.key, c.label)).join("");
  return `<select data-f="category">${opts}</select>`;
}

function card(p, i) {
  const m = (S.data.manifest || {})[p.slug] || { photos:0, videos:0 };
  const open = (p.slug === "_new" || p.slug === S.open) ? " open" : "";
  return `<details class="card" data-i="${i}" data-slug="${esc(p.slug)}"${open}>
    <summary><span class="who">${esc(p.client)}</span><span class="what">${esc(p.title)}</span>
      <span class="meta">${m.photos} photos · ${m.videos} videos · ${esc(p.slug)}</span></summary>
    <div class="body">
      <div class="grid g2">
        <div><label>Client</label><input data-f="client" value="${esc(p.client)}"></div>
        <div><label>Title</label><input data-f="title" value="${esc(p.title)}"></div>
      </div>
      <label>One-line summary <span class="hint">(shown on cards)</span></label>
      <input data-f="oneliner" value="${esc(p.oneliner)}">
      <div class="grid g3">
        <div><label>Role</label><input data-f="role" value="${esc(p.role)}"></div>
        <div><label>Years</label><input data-f="years" value="${esc(p.years)}"></div>
        <div><label>Location</label><input data-f="location" value="${esc(p.location)}"></div>
      </div>
      <div class="grid g3">
        <div><label>Category</label>${catSelect(p)}</div>
        <div><label>Tags <span class="hint">(comma)</span></label><input data-f="tags" value="${esc((p.tags||[]).join(", "))}"></div>
        <div><label>&nbsp;</label><label class="chk"><input type="checkbox" data-f="featured"${p.featured ? " checked" : ""}> Featured on the home page</label></div>
      </div>
      <label>Brief <span class="hint">(what the client needed)</span></label>
      <textarea data-f="brief" rows="4">${esc(p.brief)}</textarea>
      <label>What I did <span class="hint">(one line each)</span></label>
      <textarea data-f="did" rows="3">${esc(lines(p.did))}</textarea>
      <div class="grid g2">
        <div><label>Scope <span class="hint">(one line each)</span></label><textarea data-f="scope" rows="3">${esc(lines(p.scope))}</textarea></div>
        <div><label>Result</label><textarea data-f="result" rows="3">${esc(p.result)}</textarea></div>
      </div>
      <div class="row">
        <button class="save" data-save="${i}">Save project</button>
        <span class="status" data-st="${i}"></span>
      </div>
      <p class="hint">Placeholders like <span class="ph">[Placeholder: …]</span> block publishing until they are replaced.</p>
      ${mediaHTML(p.slug)}
    </div>
  </details>`;
}

const murl = p => "/media?p=" + encodeURIComponent(p) + "&t=" + (S.stamp || 0);

function mediaHTML(slug) {
  if (!slug || slug === "_new") return "";
  const m = (S.data.media || {})[slug] || { photos: [], videos: [] };
  const photos = m.photos || [], videos = m.videos || [];
  const tiles = photos.map((ph, i) => `
    <div class="tile${i === 0 ? " cover" : ""}">
      ${i === 0 ? '<span class="badge">Cover</span>' : ""}
      <img loading="lazy" src="${murl(ph.thumb || ph.full)}" alt="">
      <div class="ctl">
        <button data-pmove="${slug}|${i}|-1" title="Move left"${i === 0 ? " disabled" : ""}>‹</button>
        <span class="idx">${i + 1}/${photos.length}</span>
        <button data-pmove="${slug}|${i}|1" title="Move right"${i === photos.length - 1 ? " disabled" : ""}>›</button>
        <button class="del" data-pdel="${slug}|${i}" title="Remove">✕</button>
      </div>
      <input value="${esc(ph.alt || "")}" data-palt="${slug}|${i}" placeholder="Alt text">
    </div>`).join("");
  const rows = videos.map((v, i) => `
    <div class="vid">
      ${v.poster ? `<img class="poster" src="${murl(v.poster)}" alt="">`
                 : `<div class="none" data-vposter="${slug}|${i}">Add poster</div>`}
      <div>
        <label>Title</label><input data-vtitle="${slug}|${i}" value="${esc(v.title || "")}">
        <label>Livid link</label><input data-vlivid="${slug}|${i}" value="${esc(v.livid || "")}">
      </div>
      <div>
        <label>Ratio</label>
        <select data-vratio="${slug}|${i}">
          ${["9 / 16", "16 / 9", "1 / 1", "4 / 5"].map(r => `<option${(v.ratio || "") === r ? " selected" : ""}>${r}</option>`).join("")}
        </select>
        <div class="ctl">
          <button data-vmove="${slug}|${i}|-1"${i === 0 ? " disabled" : ""}>↑</button>
          <button data-vmove="${slug}|${i}|1"${i === videos.length - 1 ? " disabled" : ""}>↓</button>
          <button data-vdel="${slug}|${i}">✕</button>
        </div>
      </div>
    </div>`).join("");
  return `<div class="media" data-media="${slug}">
    <h3>Photos · ${photos.length}
      <button class="ghost" data-addphotos="${slug}">Add photos</button>
      <input type="file" accept="image/*" multiple hidden data-fileinput="${slug}">
      <span class="uploading" data-up="${slug}"></span>
    </h3>
    <div class="strip">${tiles || '<span class="hint">No photos in this project yet.</span>'}</div>
    <h3 style="margin-top:14px">Videos · ${videos.length}
      <button class="ghost" data-addvideo="${slug}">Add video</button>
    </h3>
    <div class="vids">${rows || '<span class="hint">No videos in this project yet.</span>'}</div>
  </div>`;
}

function render() {
  const q = ($("#q").value || "").toLowerCase().trim();
  const list = S.data.projects.filter(p => !q || (p.slug + " " + p.client + " " + p.title).toLowerCase().includes(q));
  $("#list").innerHTML = list.map(p => card(p, S.data.projects.indexOf(p))).join("") || "<p>No match.</p>";
}

function payload(i) {
  const el = document.querySelector(`details[data-i="${i}"]`); const out = {};
  el.querySelectorAll("[data-f]").forEach(f => {
    const k = f.dataset.f;
    if (f.type === "checkbox") out[k] = f.checked;
    else if (k === "tags") out[k] = f.value.split(",").map(s => s.trim()).filter(Boolean);
    else if (k === "did" || k === "scope") out[k] = f.value.split("\n").map(s => s.trim()).filter(Boolean);
    else out[k] = f.value;
  });
  const p = S.data.projects[i];
  if (p && p.slug !== "_new") out.slug = p.slug;
  return out;
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.tab) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === t));
    document.querySelectorAll(".tab").forEach(s => s.classList.toggle("on", s.id === t.dataset.tab));
    return;
  }
  if (t.dataset.addphotos !== undefined) {
    document.querySelector(`[data-fileinput="${t.dataset.addphotos}"]`).click();
    return;
  }
  if (t.dataset.addvideo !== undefined) {
    const link = prompt("Livid link or video id");
    if (!link) return;
    const title = prompt("Video title") || "Untitled";
    await mediaAction({ slug: t.dataset.addvideo, kind: "video", action: "add",
      item: { title, livid: link, poster: "", ratio: "9 / 16" } });
    return;
  }
  if (t.dataset.pmove !== undefined) {
    const [slug, i, d] = t.dataset.pmove.split("|");
    await mediaAction({ slug, kind: "photo", action: "move", from: +i, to: +i + +d });
    return;
  }
  if (t.dataset.pdel !== undefined) {
    const [slug, i] = t.dataset.pdel.split("|");
    if (!confirm("Remove this photo from the project? The file moves to tools/removed-media.")) return;
    await mediaAction({ slug, kind: "photo", action: "remove", index: +i });
    return;
  }
  if (t.dataset.vmove !== undefined) {
    const [slug, i, d] = t.dataset.vmove.split("|");
    await mediaAction({ slug, kind: "video", action: "move", from: +i, to: +i + +d });
    return;
  }
  if (t.dataset.vdel !== undefined) {
    const [slug, i] = t.dataset.vdel.split("|");
    if (!confirm("Remove this video from the project?")) return;
    await mediaAction({ slug, kind: "video", action: "remove", index: +i });
    return;
  }
  if (t.dataset.vposter !== undefined) {
    const [slug, i] = t.dataset.vposter.split("|");
    const pick = document.createElement("input");
    pick.type = "file"; pick.accept = "image/*";
    pick.onchange = async () => {
      const f = pick.files[0]; if (!f) return;
      const up = await upload(slug, f, "poster");
      if (up) await mediaAction({ slug, kind: "video", action: "update", index: +i, poster: up.full });
    };
    pick.click();
    return;
  }
  if (t.id === "newbtn") {
    S.data.projects.unshift({ slug:"_new", client:"", title:"", oneliner:"", role:"", years:"", location:"", tags:[], brief:"", did:[], scope:[], result:"", featured:false, category:"food-beverage" });
    render(); document.querySelector('details[data-i="0"]').scrollIntoView({block:"start"});
    return;
  }
  if (t.id === "rebuild") {
    const st = $("#build"); st.textContent = "building…";
    const r = await fetch("/api/build", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    const d = await r.json(); st.textContent = d.ok ? "build ok" : "build failed";
    return;
  }
  if (t.dataset.save !== undefined) {
    const i = +t.dataset.save, st = document.querySelector(`[data-st="${i}"]`);
    status(st, "saving…");
    const r = await fetch("/api/project", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload(i))});
    const d = await r.json();
    if (!r.ok) return status(st, d.error || "Save failed", "bad");
    status(st, d.action === "created" ? "created · site rebuilt" : "saved · site rebuilt", "good");
    await load();
    return;
  }
  if (t.id === "savecopy") {
    const body = {}; document.querySelectorAll("#copyform [data-k]").forEach(f => {
      const k = f.dataset.k;
      if (k === "bio" || k === "collabnames") return;
      if (k.startsWith("intro:")) { body.page_intros = body.page_intros || {}; body.page_intros[k.slice(6)] = f.value; }
      else body[k] = f.value;
    });
    body.bio = $("#copyform [data-k=bio]").value.split("\n").map(s => s.trim()).filter(Boolean);
    body.collaborations = { names: $("#copyform [data-k=collabnames]").value.split("\n").map(s => s.trim()).filter(Boolean) };
    const st = $("#copystatus"); status(st, "saving…");
    const r = await fetch("/api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) return status(st, d.error || "Save failed", "bad");
    status(st, "saved · site rebuilt", "good"); load();
  }
});

function renderCopy() {
  const c = S.data.config, intros = c.page_intros || {};
  const field = (k, label, val, kind) => kind === "area"
    ? `<label>${label}</label><textarea data-k="${k}" rows="3">${esc(val)}</textarea>`
    : `<label>${label}</label><input data-k="${k}" value="${esc(val)}">`;
  $("#copyform").innerHTML = `
    <div class="copy-block"><h2>Identity</h2>
      <div class="grid g2">
        <div>${field("name","Name",c.name)}</div>
        <div>${field("title","Title",c.title)}</div>
      </div>
      ${field("headline","Headline",c.headline,"area")}
      ${field("subline","Subline",c.subline,"area")}
      <div class="grid g3">
        <div>${field("based","Based",c.based)}</div>
        <div>${field("email","Email",c.email)}</div>
        <div>${field("domain","Domain",c.domain)}</div>
      </div>
      <div class="grid g3">
        <div>${field("instagram","Instagram",c.instagram)}</div>
        <div>${field("linkedin","LinkedIn",c.linkedin)}</div>
        <div>${field("resume_pdf","Résumé file",c.resume_pdf)}</div>
      </div>
    </div>
    <div class="copy-block"><h2>About</h2>
      ${field("bio","Bio (one paragraph per line)",(c.bio||[]).join("\n"),"area")}
      ${field("cta","Closing line / call to action",c.cta,"area")}
      <div class="grid g2">
        <div>${field("education","Education",c.education)}</div>
        <div>${field("languages","Languages",c.languages)}</div>
      </div>
    </div>
    <div class="copy-block"><h2>Collaborations</h2>
      ${field("collabnames","Brands (one per line)",((c.collaborations||{}).names||[]).join("\n"),"area")}
    </div>
    <div class="copy-block"><h2>Page intros</h2>
      ${Object.keys(intros).map(k => field("intro:"+k, k, intros[k], "area")).join("")}
    </div>`;
}

async function mediaAction(body) {
  S.open = body.slug;
  const r = await fetch("/api/media", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) { alert(d.error || "Media change failed"); return null; }
  await load();
  return d;
}

async function upload(slug, file, kind) {
  const up = document.querySelector(`[data-up="${slug}"]`);
  if (up) up.textContent = "uploading " + file.name + "…";
  try {
    const r = await fetch(`/api/upload?slug=${encodeURIComponent(slug)}&kind=${kind}&name=${encodeURIComponent(file.name)}`,
      {method: "POST", headers: {"Content-Type": "application/octet-stream"}, body: file});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "upload failed");
    return d;
  } catch (err) {
    alert("Upload failed: " + err.message);
    return null;
  } finally {
    if (up) up.textContent = "";
  }
}

document.addEventListener("change", async e => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.fileinput !== undefined) {
    const slug = t.dataset.fileinput, files = [...t.files];
    if (!files.length) return;
    const items = [];
    for (const f of files) { const d = await upload(slug, f, "photo"); if (d) items.push(d); }
    t.value = "";
    if (items.length) await mediaAction({ slug, kind: "photo", action: "add", items });
    return;
  }
  if (t.dataset.palt !== undefined) {
    const [slug, i] = t.dataset.palt.split("|");
    await mediaAction({ slug, kind: "photo", action: "update", index: +i, alt: t.value });
    return;
  }
  if (t.dataset.vtitle !== undefined) {
    const [slug, i] = t.dataset.vtitle.split("|");
    await mediaAction({ slug, kind: "video", action: "update", index: +i, title: t.value });
    return;
  }
  if (t.dataset.vlivid !== undefined) {
    const [slug, i] = t.dataset.vlivid.split("|");
    await mediaAction({ slug, kind: "video", action: "update", index: +i, livid: t.value });
    return;
  }
  if (t.dataset.vratio !== undefined) {
    const [slug, i] = t.dataset.vratio.split("|");
    await mediaAction({ slug, kind: "video", action: "update", index: +i, ratio: t.value });
  }
});

document.addEventListener("toggle", e => {
  const el = e.target;
  if (el.matches && el.matches("details.card")) {
    if (el.open) S.open = el.dataset.slug;
    else if (S.open === el.dataset.slug) S.open = null;
  }
}, true);

$("#q").addEventListener("input", render);
