<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Adrian Rivera Ferran</title>
<meta name="description" content="Contact Adrian Rivera Ferran, food & beverage photographer and videographer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">Adrian Rivera Ferran</a>
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="main">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <p class="kicker">Contact</p>
    <h2>Let's talk</h2>
    <p class="lede">Bookings, full-time roles, or just to say hello. Prefer email? Write to <a href="mailto:adrian@riveraferran.com">adrian@riveraferran.com</a>.</p>
    <form class="contact" id="contact-form" data-endpoint="https://formspree.io/f/mgaoebdr" data-email="adrian@riveraferran.com" action="#" method="POST">
      <label for="cf-name">Name</label>
      <input id="cf-name" type="text" name="name" required autocomplete="name">
      <label for="cf-email">Email</label>
      <input id="cf-email" type="email" name="email" required autocomplete="email">
      <label for="cf-message">Message</label>
      <textarea id="cf-message" name="message" required></textarea>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <input type="hidden" name="_subject" value="Portfolio inquiry — riveraferran.com">
      <button type="submit">Send message</button>
      <p class="form-status" role="status"></p>
    </form>

  </div>
</section>
<footer class="site">
  <div class="wrap">
    <span>© 2026 Adrian Rivera Ferran · New York City · San Juan, Puerto Rico</span>
    <span><a href="mailto:adrian@riveraferran.com">adrian@riveraferran.com</a></span>
  </div>
</footer>
<script src="assets/js/main.js"></script>
</body>
</html>
